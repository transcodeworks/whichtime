[workspace]
members = [
  "common/uniffi-bindgen",
  "common/whichtime",
  "common/whichtime-cli",
  "common/whichtime-ffi",
  "common/whichtime-sys",
  "examples/rust",
]
resolver = "3"

[workspace.package]
authors = ["Transcode Inc. <info@transcode.works>"]
description = "A natural language date parsing library written in Rust"
edition = "2024"
homepage = "https://transcodeworks.github.io/whichtime/"
license = "MIT"
repository = "https://github.com/transcodeworks/whichtime"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
fancy-regex = "0.17"
lazy_static = "1.5"
regex = "1.12.3"
regex-macro = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { version = "2" }

uniffi = "0.31"
uniffi_bindgen = "0.31"

whichtime = { version = "0.1.0", path = "common/whichtime" }
whichtime-ffi = { version = "0.1.0", path = "common/whichtime-ffi" }
whichtime-sys = { version = "0.1.0", path = "common/whichtime-sys" }
