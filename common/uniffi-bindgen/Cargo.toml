[package]
name = "uniffi-bindgen"
description = "Helper binary crate to run uniffi-bindgen for whichtime."
edition = "2021"
publish = false
authors.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bindgen-swift.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
